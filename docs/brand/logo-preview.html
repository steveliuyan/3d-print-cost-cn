<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>3D 打印成本计算器 · 品牌标识预览</title>
<style>
  :root{ --accent:#4f46e5; --ink:#14161a; --muted:#8b93a1; --line:#e5e7eb; --bg:#f4f5f8; }
  *{box-sizing:border-box}
  body{margin:0;padding:40px 24px 64px;background:var(--bg);color:var(--ink);
       font:15px/1.6 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
  .wrap{max-width:920px;margin:0 auto}
  h1{font-size:22px;margin:0 0 4px;letter-spacing:-.02em}
  .sub{color:var(--muted);font-size:13px;margin:0 0 32px}
  h2{font-size:13px;font-weight:650;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;
     margin:36px 0 14px}
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:28px;
        box-shadow:0 12px 32px -24px rgba(20,22,26,.3)}
  .hero{display:flex;align-items:center;gap:28px;flex-wrap:wrap}
  .scales{display:flex;align-items:flex-end;gap:22px;flex-wrap:wrap}
  .scales figure{margin:0;text-align:center}
  .scales figcaption{font-size:11px;color:var(--muted);margin-top:8px;font-variant-numeric:tabular-nums}
  .dark{background:#0f1116;border-color:#262a33}
  .dark .scales figcaption{color:#7b8494}
  .lockup{display:flex;align-items:center;gap:12px}
  .lockup .txt b{display:block;font-size:17px;letter-spacing:-.02em}
  .lockup .txt span{display:block;font-size:11px;color:var(--muted);margin-top:2px}
  .rule{height:3px;background:var(--accent);border-radius:2px;margin:18px 0 0}
  .note{font-size:12.5px;color:var(--muted);margin:10px 0 0}
  .swatch{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-top:14px}
  .chip{width:16px;height:16px;border-radius:5px;background:var(--accent)}
  code{background:#eef0f4;border-radius:5px;padding:1px 6px;font-size:12.5px}
</style>
</head>
<body>
<div class="wrap">
  <h1>3D 打印成本计算器 · 品牌标识</h1>
  <p class="sub">矢量 SVG · 内嵌单文件 · 随主题换色 · 方形标识（mark）</p>

  <h2>主展示</h2>
  <div class="card hero">
    <img src="logo-mark.svg" alt="品牌标识" width="160" height="160">
    <div>
      <div class="lockup">
        <img src="logo-mark.svg" alt="" width="44" height="44">
        <div class="txt"><b>3D 打印成本计算器</b><span>材料 · 折旧 · 电费 · 人工 · 后处理 · 失败率</span></div>
      </div>
      <div class="rule" style="max-width:420px"></div>
      <p class="note">深色顶栏 / 报价单抬头均可直接复用，<code>currentColor</code> 继承父级颜色。</p>
      <div class="swatch"><span class="chip"></span> 品牌主色 #4f46e5</div>
    </div>
  </div>

  <h2>多尺寸</h2>
  <div class="card scales">
    <figure><img src="logo-mark.svg" alt="" width="96" height="96"><figcaption>96</figcaption></figure>
    <figure><img src="logo-mark.svg" alt="" width="64" height="64"><figcaption>64</figcaption></figure>
    <figure><img src="logo-mark.svg" alt="" width="48" height="48"><figcaption>48</figcaption></figure>
    <figure><img src="logo-mark.svg" alt="" width="32" height="32"><figcaption>32</figcaption></figure>
    <figure><img src="logo-mark.svg" alt="" width="24" height="24"><figcaption>24</figcaption></figure>
    <figure><img src="logo-mark.svg" alt="" width="16" height="16"><figcaption>16</figcaption></figure>
  </div>

  <h2>深色底（白色版）</h2>
  <div class="card dark scales">
    <figure><img src="logo-mark.svg" alt="" width="72" height="72" style="color:#fff"><figcaption>72</figcaption></figure>
    <figure><img src="logo-mark.svg" alt="" width="48" height="48" style="color:#fff"><figcaption>48</figcaption></figure>
    <figure><img src="logo-mark.svg" alt="" width="32" height="32" style="color:#c7cbf5"><figcaption>32</figcaption></figure>
    <figure><img src="logo-mark.svg" alt="" width="24" height="24" style="color:#fff"><figcaption>24</figcaption></figure>
  </div>
</div>
</body>
</html>
